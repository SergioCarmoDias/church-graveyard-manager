<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111827; /* Matches your theme color */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="splash-video" autoplay muted playsinline>
    <source src="logo-animation.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const { ipcRenderer } = require('electron');
    const video = document.getElementById('splash-video');

    // When the MP4 animation finishes playing, notify main.js
    video.onended = () => {
      ipcRenderer.send('splash-complete');
    };

    // Fallback timer just in case video takes too long (e.g., 4 seconds)
    setTimeout(() => {
      ipcRenderer.send('splash-complete');
    }, 4000);
  </script>
</body>
</html>
